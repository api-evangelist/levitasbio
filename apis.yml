aid: levitasbio
name: LevitasBio
description: >-
  LevitasBio is a Menlo Park, California life-science instrumentation company, founded in 2017,
  that commercializes magnetic levitation technology developed at Stanford and Harvard for
  label-free separation and characterization of living cells. Its LeviCell family of benchtop
  instruments (LeviCell 1.0, LeviCell Access 1.0, LeviCell EOS and the high-throughput LeviCell 96)
  suspends cells in three-dimensional space and separates viable cells from dead cells and debris
  without antibodies, beads or other labels. The platform is surrounded by LeviPrep tissue
  dissociation and nuclei extraction kits, the Nuvo automated tissue prep system, LeviSelect
  untouched depletion kits (tissue RBC, immune cell, mouse myelin, cell debris) and LeviMetrics,
  an AI-based analysis software layer that reads bright-field and fluorescence imagery captured
  during a run to characterize the sample. Customers use the platform for viable cell enrichment,
  single-cell genomics, cancer profiling and 3D culture/organoid workflows. LevitasBio sells
  instruments and consumables through a direct and distributor channel and, as of this profiling
  pass, publishes no public developer program, API, SDK or machine-readable interface contract.
